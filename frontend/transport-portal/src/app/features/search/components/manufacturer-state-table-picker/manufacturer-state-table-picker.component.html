<div class="picker-container">
  <div class="picker-header">
    <h4>Manufacturer + State</h4>

    <!-- Search Box -->
    <div class="search-box">
      <input
        type="text"
        [(ngModel)]="searchTerm"
        (ngModelChange)="onSearchChange()"
        placeholder="Search manufacturer..."
        class="search-input"
      />
    </div>

    <!-- Visible Rows Dropdown -->
    <div class="page-size-control">
      <label for="pageSize">Show:</label>
      <select
        id="pageSize"
        [(ngModel)]="pageSize"
        (ngModelChange)="onPageSizeChange()"
        class="page-size-select"
      >
        <option *ngFor="let option of visibleRowOptions" [value]="option">
          {{ option }} rows
        </option>
      </select>
      <span class="total-info"
        >of {{ filteredGroups.length }} manufacturers</span
      >
    </div>
  </div>

  <!-- Loading State -->
  <div *ngIf="loading" class="loading-state">
    <p>Loading combinations...</p>
  </div>

  <!-- Nested Table -->
  <div *ngIf="!loading" class="table-wrapper">
    <nz-table
      #manufacturerTable
      [nzData]="visibleGroups"
      [nzShowPagination]="false"
      [nzFrontPagination]="false"
      nzSize="middle"
    >
      <thead>
        <tr>
          <th nzWidth="40px">
            <!-- Select All Checkbox -->
            <label
              nz-checkbox
              [nzIndeterminate]="someVisibleSelected"
              [nzChecked]="allVisibleSelected"
              (nzCheckedChange)="
                allVisibleSelected ? deselectAll() : selectAll()
              "
              title="{{
                allVisibleSelected
                  ? 'Deselect all visible'
                  : 'Select all visible'
              }}"
            >
            </label>
          </th>
          <th>Manufacturer</th>
          <th nzWidth="100px">Count</th>
          <th nzWidth="40px"></th>
          <!-- Expand -->
        </tr>
      </thead>
      <tbody>
        <ng-template ngFor let-group [ngForOf]="manufacturerTable.data">
          <!-- Parent Row -->
          <tr>
            <td>
              <label
                nz-checkbox
                [nzIndeterminate]="
                  getParentCheckboxState(group.manufacturer) === 'indeterminate'
                "
                [nzChecked]="
                  getParentCheckboxState(group.manufacturer) === 'checked'
                "
                (nzCheckedChange)="
                  onParentCheckboxChange(group.manufacturer, $event)
                "
              >
              </label>
            </td>
            <td>{{ group.manufacturer }}</td>
            <td class="count-cell">{{ group.totalCount }}</td>
            <td
              [nzExpand]="group.expanded"
              (nzExpandChange)="onExpandChange(group.manufacturer, $event)"
            ></td>
          </tr>

          <!-- Child Table (Expanded States) -->
          <tr [nzExpand]="group.expanded">
            <td colspan="4" style="padding: 0; background: #f9f9f9">
              <nz-table
                [nzData]="group.states"
                [nzShowPagination]="false"
                nzSize="small"
              >
                <tbody>
                  <tr *ngFor="let state of group.states">
                    <td nzWidth="40px"></td>
                    <!-- Indent spacing -->
                    <td nzWidth="40px">
                      <label
                        nz-checkbox
                        [nzChecked]="
                          isStateSelected(group.manufacturer, state.state)
                        "
                        (nzCheckedChange)="
                          onChildCheckboxChange(
                            group.manufacturer,
                            state.state,
                            $event
                          )
                        "
                      >
                      </label>
                    </td>
                    <td>{{ state.state }}</td>
                    <td nzWidth="100px" class="count-cell">
                      {{ state.count }}
                    </td>
                    <td nzWidth="40px"></td>
                    <!-- Align with parent expand column -->
                  </tr>
                </tbody>
              </nz-table>
            </td>
          </tr>
        </ng-template>
      </tbody>
    </nz-table>

    <!-- Pagination Controls -->
    <div class="pagination-controls" *ngIf="totalPages > 1">
      <button
        type="button"
        class="btn-page"
        (click)="previousPage()"
        [disabled]="!hasPreviousPage"
      >
        ‹ Prev
      </button>

      <div class="page-numbers">
        <button
          *ngFor="let page of pageNumbers"
          type="button"
          class="btn-page-num"
          [class.active]="page === currentPage"
          [disabled]="page === -1"
          (click)="goToPage(page)"
        >
          <span *ngIf="page > 0">{{ page }}</span>
          <span *ngIf="page === -1">...</span>
        </button>
      </div>

      <button
        type="button"
        class="btn-page"
        (click)="nextPage()"
        [disabled]="!hasNextPage"
      >
        Next ›
      </button>
    </div>
  </div>

  <!-- Selected Items (Chips) -->
  <div class="chips-section">
    <div class="chips-label">Selected ({{ selectedChips.length }}):</div>
    <div class="chips-container">
      <div *ngIf="selectedChips.length === 0" class="no-selections">
        No selections
      </div>
      <div *ngFor="let chip of selectedChips" class="chip">
        <span class="chip-text"
          >{{ chip.manufacturer }} - {{ chip.state }}</span
        >
        <button
          type="button"
          class="chip-remove"
          (click)="removeChip(chip)"
          [attr.aria-label]="'Remove ' + chip.manufacturer + ' - ' + chip.state"
        >
          ×
        </button>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="actions-section">
    <button
      type="button"
      class="btn btn-primary"
      (click)="onApply()"
      [disabled]="selectedChips.length === 0"
      nz-tooltip
      nzTooltipTitle="Applies {{ selectedChips.length }} manufacturer-state combination filters. The actual number of aircraft returned will depend on how many aircraft match these combinations."
    >
      Apply ({{ selectedChips.length }})
    </button>
    <button
      type="button"
      class="btn btn-secondary"
      (click)="onClear()"
      [disabled]="selectedChips.length === 0"
    >
      Clear
    </button>
  </div>
</div>
